<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Vivarium - Documentation Swagger Complète</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin:0;
            background: #fafafa;
        }
        .swagger-ui .topbar {
            background-color: #2c3e50;
        }
        .swagger-ui .topbar .download-url-wrapper {
            display: none;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Charger le schéma Swagger complet
            fetch('./swagger-complete-manual.json')
                .then(response => response.json())
                .then(data => {
                    const ui = SwaggerUIBundle({
                        spec: data,
                        dom_id: '#swagger-ui',
                        deepLinking: true,
                        presets: [
                            SwaggerUIBundle.presets.apis,
                            SwaggerUIStandalonePreset
                        ],
                        plugins: [
                            SwaggerUIBundle.plugins.DownloadUrl
                        ],
                        layout: "StandaloneLayout",
                        tryItOutEnabled: true,
                        requestInterceptor: (request) => {
                            // Ajouter l'URL de base si nécessaire
                            if (!request.url.startsWith('http')) {
                                request.url = 'http://localhost:3000' + request.url;
                            }
                            return request;
                        }
                    });
                })
                .catch(error => {
                    console.error('Erreur lors du chargement du schéma Swagger:', error);
                    document.getElementById('swagger-ui').innerHTML = 
                        '<div style="padding: 20px; text-align: center;">' +
                        '<h2>Erreur de chargement</h2>' +
                        '<p>Impossible de charger la documentation Swagger.</p>' +
                        '<p>Assurez-vous que le fichier swagger-complete-manual.json est accessible.</p>' +
                        '</div>';
                });
        };
    </script>
</body>
</html>
